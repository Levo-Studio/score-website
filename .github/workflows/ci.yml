name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      # Laufen zuletzt und auch nach einem früheren Fehlschlag, damit sich
      # Audit-Funde und die übrigen Ergebnisse nicht gegenseitig verdecken.
      - name: Audit production dependencies
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level high

      - name: Audit all dependencies
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --file Dockerfile.dokploy --tag score-website:ci .

      - name: Start container
        run: docker run --detach --name score-website --publish 6239:6239 score-website:ci

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:6239/api/health; then
              echo
              echo "Health check passed after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not answer /api/health with 200."
          exit 1

      - name: Check pages and assets
        run: |
          set -euo pipefail
          BASE="http://127.0.0.1:6239"
          HTML="$(curl --fail --silent --show-error --max-time 10 "${BASE}/")"
          ASSET="$(grep -oE '/_next/static/[^"]+\.(css|js)' <<<"$HTML" | sed -n 1p)"
          for path in / /datenschutz /impressum "$ASSET" /score-og-1200x630.png; do
            curl --fail --silent --show-error --max-time 10 --output /dev/null "${BASE}${path}"
            echo "200 ${path}"
          done

      - name: Container logs
        if: failure()
        run: docker logs score-website
