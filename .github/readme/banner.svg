<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(140 60) scale(420)">
      <stop offset="0%" stop-color="#4EA3A6" stop-opacity=".34">
        <animate attributeName="stop-opacity" values=".18;.4;.18" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4EA3A6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edge" x1="0" x2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4EA3A6" />
      <stop offset="62%" stop-color="#4EA3A6" stop-opacity=".15" />
      <stop offset="100%" stop-color="#4EA3A6" stop-opacity="0" />
    </linearGradient>
    <clipPath id="barClip">
      <rect x="700" y="150" width="420" height="8" rx="4" />
    </clipPath>
  </defs>

  <rect width="1200" height="260" rx="28" fill="#0A0D0C" />
  <rect width="1200" height="260" rx="28" fill="url(#glow)" />

  <g transform="translate(64 56)">
    <circle cx="26" cy="26" r="17.7" fill="none" stroke="#EDF1EF" stroke-width="6.8" stroke-linecap="round" stroke-dasharray="92.6 111" transform="rotate(-58 26 26)" />
    <circle cx="26" cy="26" r="4.2" fill="#4EA3A6" />
  </g>
  <text x="130" y="76" font-family="Arial, sans-serif" font-weight="800" font-size="26" letter-spacing="-.8" fill="#EDF1EF">Score</text>

  <text x="64" y="140" font-family="Arial, sans-serif" font-weight="800" font-size="42" letter-spacing="-1.6" fill="#EDF1EF">Dein Abischnitt.</text>
  <text x="64" y="182" font-family="Arial, sans-serif" font-weight="800" font-size="42" letter-spacing="-1.6" fill="#7E8784">Live mitgerechnet.</text>

  <g>
    <circle cx="68" cy="208" r="4" fill="#4EA3A6">
      <animate attributeName="opacity" values="1;.25;1" dur="2.6s" repeatCount="indefinite" />
    </circle>
    <text x="82" y="212" font-family="Arial, sans-serif" font-size="14" fill="#7E8784">iPhone &amp; iPad · kostenlos · Baden-Württemberg</text>
  </g>

  <text x="700" y="70" font-family="Arial, sans-serif" font-weight="500" font-size="13" fill="#7E8784">Kursblock + Prüfungsblock</text>
  <text x="700" y="126" font-family="Arial, sans-serif" font-weight="800" font-size="48" letter-spacing="-1.6" fill="#EDF1EF">300–900</text>
  <text x="924" y="126" font-family="Arial, sans-serif" font-weight="400" font-size="18" fill="#7E8784">Punkte</text>

  <rect x="700" y="150" width="420" height="8" rx="4" fill="rgba(237,241,239,.14)" />
  <rect x="700" y="150" width="0" height="8" rx="4" fill="#4EA3A6" clip-path="url(#barClip)">
    <animate attributeName="width" values="0;420;420" keyTimes="0;0.6;1" dur="3.5s" repeatCount="indefinite" />
  </rect>
  <text x="700" y="182" font-family="Arial, sans-serif" font-size="12.5" fill="#7E8784">300</text>
  <text x="1120" y="182" font-family="Arial, sans-serif" font-size="12.5" fill="#7E8784" text-anchor="end">900</text>

  <rect y="255" width="1200" height="5" fill="url(#edge)" />
</svg>
